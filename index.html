<!--
=====================================================================
 NUEVO PACTO - Iglesia Evangelica Pentecostes (SCV)
 Single-file church planning app. Mobile first. Spanish default.
 Version 0.3  Built by Todd Marshall with Claude.

 FILE MAP (search for the === banners):
   === CSS ===              theme variables (light/dark), layout
   === CONFIG ===           services, weekly events, age groups, roles
   === I18N ===             every UI string, Spanish + English
   === DATA STORE ===       load/save. Swap this section for a backend.
   === DEMO DATA ===        sample people/posts so the demo is not empty
   === HELPERS ===          dates, ids, escaping, permissions
   === VIEWS ===            one function per screen (viewHome, viewKids...)
   === ACTIONS (A.) ===     everything a button can do
   === INIT ===             startup
 See AI-EDIT-GUIDE.md next to this file before changing anything.
=====================================================================
-->
<style>
/* === CSS === */
:root{
  --black:#0b0b0b; --y:#f5c518; --o:#f26b1d;
  --red:#c62828; --gold:#e6a817; --blue:#1e63b8; --purple:#7b1fa2;
  --bg:#f4f3ef; --card:#ffffff; --text:#171717; --muted:#6b6b6b; --border:#e3e1da; --soft:#faf7ee;
  --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#121212; --card:#1d1d1d; --text:#f2f2f2; --muted:#a3a3a3; --border:#2e2e2e; --soft:#262318;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h2{font-size:1.25rem}h3{font-size:1.05rem}
a{color:var(--blue)}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.top img{height:44px;width:44px;border-radius:10px;object-fit:cover}
.top .name{flex:1;line-height:1.1}
.top .name b{font-size:1.15rem;color:var(--y)}
.top .name small{display:block;color:#bbb;font-size:.7rem;letter-spacing:.08em}
.lang{background:var(--y);color:#111;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:.95rem;cursor:pointer}
.lang span{opacity:.45}.lang span.on{opacity:1}
.icon-btn{background:#2a2a2a;color:#fff;border:0;border-radius:999px;width:40px;height:40px;font-size:1.15rem;cursor:pointer}
/* layout */
main{padding:14px 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.accent-red{border-left:6px solid var(--red)}.card.accent-gold{border-left:6px solid var(--gold)}
.card.accent-blue{border-left:6px solid var(--blue)}.card.accent-purple{border-left:6px solid var(--purple)}
.card.pastor{background:linear-gradient(135deg,var(--black),#2a2410);color:#fff;border:1px solid var(--y)}
.card.pastor .muted{color:#ddd}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
.right{margin-left:auto}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--border);color:var(--text);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.p{background:var(--o);color:#fff}.btn.y{background:var(--y);color:#111}.btn.b{background:var(--blue);color:#fff}
.btn.r{background:var(--red);color:#fff}.btn.g{background:#2e7d32;color:#fff}.btn.pu{background:var(--purple);color:#fff}
.btn.sm{padding:7px 11px;font-size:.85rem;border-radius:9px}.btn.block{width:100%}.btn.ghost{background:transparent;border:1px solid var(--border)}
.btn:disabled{opacity:.45}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--soft);border:1px solid var(--border)}
.chip.red{background:var(--red);color:#fff;border:0}.chip.gold{background:var(--gold);color:#111;border:0}
.chip.blue{background:var(--blue);color:#fff;border:0}.chip.purple{background:var(--purple);color:#fff;border:0}
.chip.green{background:#2e7d32;color:#fff;border:0}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=search],input[type=number],select,textarea{
  width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:4px 0 10px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-top:6px}
.list .item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border)}
.list .item:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.avatar.blue{background:var(--blue)}.avatar.purple{background:var(--purple)}.avatar.gold{background:var(--gold);color:#111}
.toggle{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center}
.toggle.on{background:#2e7d32;border-color:#2e7d32;color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button{flex:none;border:0;border-radius:999px;padding:9px 14px;background:var(--card);border:1px solid var(--border);font-weight:700;cursor:pointer}
.tabs button.on{background:var(--black);color:var(--y);border-color:var(--black)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 10px;border-radius:16px;background:var(--card);border:1px solid var(--border);font-weight:800;cursor:pointer;text-align:center}
.big .ic{font-size:2rem}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:.72rem;color:var(--muted);font-weight:700}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;gap:3px}
.cal .d.other{opacity:.3}.cal .d.today{border-color:var(--o);font-weight:800;color:var(--o)}.cal .d.sel{background:var(--black);color:var(--y)}
.dots{display:flex;gap:2px}.dot{width:6px;height:6px;border-radius:50%}
.dot.red{background:var(--red)}.dot.gold{background:var(--gold)}.dot.blue{background:var(--blue)}.dot.purple{background:var(--purple)}.dot.o{background:var(--o)}
/* posts */
.post img.photo{width:100%;border-radius:12px;margin-top:8px;max-height:420px;object-fit:cover}
.post .meta{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.react{border:1px solid var(--border);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700}
.react.on{background:var(--y);color:#111;border-color:var(--y)}
.comment{padding:8px 10px;border-radius:10px;background:var(--soft);margin-top:6px;font-size:.92rem}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--black);display:flex;z-index:20}
nav button{flex:1;border:0;background:transparent;color:#9a9a9a;font-size:.68rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button .ic{font-size:1.45rem}
nav button.on{color:var(--y)}
/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal .bar{width:44px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--black);color:var(--y);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.bar-row{display:flex;align-items:flex-end;gap:6px;height:90px}
.bar-row div{flex:1;background:var(--o);border-radius:6px 6px 0 0;position:relative;min-height:3px}
.bar-row div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.7rem;font-weight:700}
.bar-row div small{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:.6rem;color:var(--muted)}
.allergy{background:#ffe4e4;color:#8a1111;border-radius:8px;padding:4px 8px;font-size:.8rem;font-weight:700;display:inline-block}
[data-theme="dark"] .allergy{background:#4a1a1a;color:#ffb3b3}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.hymn{display:flex;gap:10px;align-items:center}
.hymn .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:none}
pre.lyrics .chordline{color:var(--o);font-weight:800}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:.7rem;padding:2px 7px;margin-left:4px}
pre.lyrics{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;background:var(--soft);padding:12px;border-radius:12px}
.hint{font-size:.8rem;color:var(--muted);margin:-4px 0 10px}
</style>
</head>

   Everything lives in one object DB, saved to this phone's localStorage.
   TO ADD A SHARED BACKEND LATER: replace loadDB()/saveDB() with calls to your service
   (Supabase/Firebase/Sheets). Keep the same DB shape and nothing else needs to change. */
const DB_KEY = 'nuevopacto.db.v1';
const emptyDB = () => ({
  members:[], households:[], children:[], posts:[], prayers:[], events:[], shifts:[],
  attendance:{},   // key "YYYY-MM-DD|HH:MM" -> {present:[], confirmed:[], visitors:[]}
  kids:[],         // check-in records
  groups:[],       // {id,name,color,memberIds}
  adminMsgs:[],    // private messages to the administrator
  hymns:[], setlist:[], bible:{},  // bible: "YYYY-MM" -> {book, theme, teacher, weeks:[]}
});
let DB = emptyDB();
function loadDB(){ try{ const raw=localStorage.getItem(DB_KEY); if(raw) DB=Object.assign(emptyDB(), JSON.parse(raw)); }catch(e){ console.warn('load failed',e); } }
function saveLocal(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ toast('Storage full / Almacenamiento lleno'); } }
function saveDB(){ saveLocal(); if(ONLINE && sb && PROFILE && PROFILE.approved) pushChanges(); }

/* === ONLINE (Supabase) ===
   Only active when CONFIG.supabase is filled in. Each DB collection maps to one table (id + data JSON).
   saveDB() pushes only the rows that changed; realtime pulls other people's changes. */
const ONLINE = !!(CONFIG.supabase.url && CONFIG.supabase.anonKey && !CONFIG.supabase.url.startsWith('__'));
let sb=null, SESSION=null, PROFILE=null, SYNCED={}, PROFILES=[];
const SYNC_MAP={
  members:{table:'members'}, households:{table:'households'}, children:{table:'children'}, events:{table:'events'}, shifts:{table:'shifts'},
  kids:{table:'kids_checkins'}, hymns:{table:'hymns'}, adminMsgs:{table:'admin_msgs'},
  groups:{table:'groups',cols:r=>({member_ids:r.memberIds||[]})},
  posts:{table:'posts',cols:r=>({group_id:r.groupId||null,author_member:r.authorId||null})},
  prayers:{table:'prayers',cols:r=>({author_member:r.authorMemberId||null})},
  attendance:{table:'attendance',keyed:true}, bible:{table:'bible',keyed:true},
  setlist:{table:'settings',single:true},
};
function rowsOf(col){ const m=SYNC_MAP[col]; const v=DB[col];
  if(m.single) return [{id:col,data:v}];
  if(m.keyed) return Object.entries(v).map(([k,d])=>({id:k,data:d}));
  return v.map(r=>({id:r.id,data:r,...(m.cols?m.cols(r):{})})); }
function applyRows(col,rows){ const m=SYNC_MAP[col];
  if(m.single){ const r=rows.find(x=>x.id===col); DB[col]=r?r.data:[]; }
  else if(m.keyed){ DB[col]={}; rows.forEach(r=>DB[col][r.id]=r.data); }
  else DB[col]=rows.map(r=>r.data);
  SYNCED[col]={}; rowsOf(col).forEach(r=>SYNCED[col][r.id]=JSON.stringify(r)); }
async function loadAll(){
  const res=await Promise.all(Object.keys(SYNC_MAP).map(async col=>{ const {data,error}=await sb.from(SYNC_MAP[col].table).select('*'); if(error) throw error; return [col,data]; }));
  res.forEach(([col,rows])=>applyRows(col,rows)); saveLocal(); }
let pushing=false, pushAgain=false;
async function pushChanges(){ if(pushing){ pushAgain=true; return; } pushing=true;
  try{ for(const col of Object.keys(SYNC_MAP)){ const m=SYNC_MAP[col]; const rows=rowsOf(col); const prev=SYNCED[col]||{}; const now={}; const up=[];
      rows.forEach(r=>{ const j=JSON.stringify(r); now[r.id]=j; if(prev[r.id]!==j) up.push(r); }); const del=Object.keys(prev).filter(id=>!(id in now));
      if(up.length){ const {error}=await sb.from(m.table).upsert(up); if(error){ console.error(col,error); toast(t('sync_error')); continue; } }
      if(del.length){ const {error}=await sb.from(m.table).delete().in('id',del); if(error){ console.error(col,error); toast(t('sync_error')); continue; } }
      SYNCED[col]=now; } }
  finally{ pushing=false; if(pushAgain){ pushAgain=false; pushChanges(); } } }
let rtTimer=null;
function subscribeRealtime(){ sb.channel('nuevopacto').on('postgres_changes',{event:'*',schema:'public'},()=>{ clearTimeout(rtTimer); rtTimer=setTimeout(async()=>{ if(pushing) return; try{ await loadAll(); if(can('admin')) await loadProfiles(); renderSoft(); }catch(e){ console.warn(e); } },500); }).subscribe(); }
async function loadProfiles(){ const {data}=await sb.from('profiles').select('*').order('created_at'); PROFILES=data||[]; }
async function initOnline(){
  await new Promise((res,rej)=>{ const el=document.createElement('script'); el.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'; el.onload=res; el.onerror=rej; document.head.appendChild(el); });
  sb=window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
  sb.auth.onAuthStateChange(async(ev,sess)=>{ SESSION=sess;
    if(ev==='PASSWORD_RECOVERY'){ S.authMode='reset'; render(); return; }
    if(sess){ await afterLogin(); } else { PROFILE=null; DB=emptyDB(); SYNCED={}; render(); } });
}
async function afterLogin(){ const {data}=await sb.from('profiles').select('*').eq('user_id',SESSION.user.id).maybeSingle(); PROFILE=data||null;
  if(PROFILE&&PROFILE.approved){ try{ await loadAll(); if(can('admin')) await loadProfiles(); }catch(e){ console.error(e); toast(t('sync_error')); } if(!S.rt){ subscribeRealtime(); S.rt=true; } }
  render(); }
function renderSoft(){ const a=document.activeElement; if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&a.value){ S.pendingRender=true; return; } if(document.getElementById('overlay').classList.contains('show')){ S.pendingRender=true; return; } render(); }
document.addEventListener('focusout',()=>{ if(S.pendingRender){ S.pendingRender=false; setTimeout(()=>{ if(!document.getElementById('overlay').classList.contains('show')) render(); },150); } });

/* === HELPERS === */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayYMD=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const toYMD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseYMD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
function fmtDate(ymd,long){ const d=parseYMD(ymd); const m=t('months')[d.getMonth()]; const w=t('days')[d.getDay()];
  return S.lang==='es' ? `${long?w+' ':''}${d.getDate()} de ${m}` : `${long?w+', ':''}${m} ${d.getDate()}`; }
const fmt12=hm=>{let [h,m]=hm.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${String(m).padStart(2,'0')}${ap}`;};
const ago=ms=>{const h=Math.floor((Date.now()-ms)/3600e3);if(h<1)return S.lang==='es'?'ahora':'now';if(h<24)return h+'h';return Math.floor(h/24)+'d';};
function ageOf(b){ if(!b)return null; const d=parseYMD(b),n=new Date(); let a=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--; return a; }
function groupOf(child){ if(child.classId) return child.classId; const a=ageOf(child.birthdate)??0; return (CONFIG.ageGroups.find(g=>a>=g.min&&a<=g.max)||CONFIG.ageGroups[CONFIG.ageGroups.length-1]).id; }
const me=()=>ONLINE ? (PROFILE&&PROFILE.member_id ? DB.members.find(m=>m.id===PROFILE.member_id)||null : null) : (DB.members.find(m=>m.id===S.userId)||null);
function can(p){ if(ONLINE){ if(!PROFILE||!PROFILE.approved) return false; return (CONFIG.roles[PROFILE.role]?.can||[]).includes(p); } const u=me(); if(!u) return false; return (CONFIG.roles[u.role]?.can||[]).includes(p); }
const myGroups=()=>{const u=me(); return DB.groups.filter(g=>u&&(g.memberIds.includes(u.id)||can('admin')));};
const inGroup=g=>{const u=me(); return !!u&&(g.memberIds.includes(u.id)||can('admin'));};

function chordSheet(src){ // "[D]El firma[G]mento" -> chords on the line above the words
  return src.split('\n').map(line=>{ if(!/\[[^\]]+\]/.test(line)) return `<div>${esc(line)||'&nbsp;'}</div>`;
    let ch='',ly=''; line.split(/(\[[^\]]+\])/).forEach(part=>{ if(/^\[.*\]$/.test(part)){ while(ch.length<ly.length) ch+=' '; ch+=part.slice(1,-1)+' '; } else { ly+=part; } });
    while(ly.length<ch.length) ly+=' '; return `<div class="chordline">${esc(ch)}</div><div>${esc(ly)}</div>`; }).join(''); }
const unreadAdmin=()=>can('admin')?DB.adminMsgs.filter(m=>!m.read).length:0;
const fullName=m=>m?`${m.first} ${m.last}`.trim():'';
const initials=m=>((m.first||'?')[0]+(m.last||' ')[0]).toUpperCase();
// Weekly events that fall on a given date (YYYY-MM-DD)
function weeklyOn(ymd){ const d=parseYMD(ymd); const nth=Math.ceil(d.getDate()/7);
  return CONFIG.weekly.filter(w=>w.dow===d.getDay() && (!w.nth || w.nth===nth)).map(w=>({...w,date:ymd,title:L(w),weekly:true})); }
function eventsOn(ymd){ return [...weeklyOn(ymd), ...DB.events.filter(e=>e.date===ymd).map(e=>({...e,color:e.color||'o'}))].sort((a,b)=>a.time.localeCompare(b.time)); }
function servicesOn(ymd){ return weeklyOn(ymd).filter(w=>w.kind==='service'); }
function nextService(){ const now=new Date(); for(let i=0;i<8;i++){ const d=new Date(now); d.setDate(d.getDate()+i); const y=toYMD(d);
  for(const s of servicesOn(y)){ const end=new Date(d); const [h,m]=s.time.split(':'); end.setHours(+h+2,+m); if(end>now) return {date:y,time:s.time,title:s.title}; } } return null; }
function lastServices(n){ const out=[]; const d=new Date(); for(let i=0;out.length<n && i<120;i++){ const y=toYMD(d); const ss=servicesOn(y).reverse();
  for(const s of ss){ if(new Date(y+'T'+s.time)<=new Date()) out.push({date:y,time:s.time}); } d.setDate(d.getDate()-1);} return out.slice(0,n); }
const attKey=(d,tm)=>d+'|'+tm;
function att(d,tm){ const k=attKey(d,tm); if(!DB.attendance[k]) DB.attendance[k]={present:[],confirmed:[],visitors:[]}; return DB.attendance[k]; }
function sure(key){ if(S._sure===key&&Date.now()-S._sureAt<3000){S._sure=null;return true;} S._sure=key;S._sureAt=Date.now(); toast(S.lang==='es'?'Toca otra vez para confirmar':'Tap again to confirm'); return false; }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
function shrinkImage(file,cb){ const img=new Image(); img.onload=()=>{ const max=CONFIG.maxPhotoPx; let w=img.width,h=img.height; const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r);h=Math.round(h*r);
  const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',.82)); }; img.src=URL.createObjectURL(file); }
function download(name,text,type='application/json'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); }
const sel=(opts,val,empty)=>(empty?`<option value="">${esc(empty)}</option>`:'')+opts.map(o=>`<option value="${esc(o.v)}" ${o.v===val?'selected':''}>${esc(o.l)}</option>`).join('');

/* === VIEWS === */
function render(){
  document.documentElement.setAttribute('data-theme',S.theme); document.documentElement.lang=S.lang;
  document.getElementById('themeBtn').textContent=S.theme==='dark'?'☀️':'🌙';
  document.getElementById('l-es').className=S.lang==='es'?'on':''; document.getElementById('l-en').className=S.lang==='en'?'on':'';
  if(ONLINE){ let gate=null; if(!sb) gate=`<div class="empty">${t('connecting')}</div>`; else if(!SESSION||S.authMode==='reset') gate=viewAuth(); else if(!PROFILE||!PROFILE.approved) gate=viewWait();
    if(gate){ document.getElementById('main').innerHTML=gate; document.getElementById('nav').innerHTML=''; document.getElementById('nav').style.display='none'; return; } document.getElementById('nav').style.display='flex'; }
  const views={home:viewHome,cal:viewCal,att:viewAtt,kids:viewKids,more:viewMore,hymns:viewHymns,bible:viewBible,prayer:viewPrayer,members:viewMembers,settings:viewSettings,groups:viewGroups,group:viewGroup,adminmsg:viewAdminMsg,users:viewUsers};
  document.getElementById('main').innerHTML=(views[S.view]||viewHome)();
  const navItems=[['home','🏠',t('nav_home')],['cal','📅',t('nav_cal')],['att','✅',t('nav_att')],['kids','🧒',t('nav_kids')],['more','☰',t('nav_more')]];
  const moreViews=['more','hymns','bible','prayer','members','settings','groups','group','adminmsg','users'];
  document.getElementById('nav').innerHTML=navItems.map(([v,ic,l])=>`<button class="${(S.view===v||(v==='more'&&moreViews.includes(S.view)))?'on':''}" onclick="A.go('${v}')"><span class="ic">${ic}</span>${l}</button>`).join('');
  window.scrollTo(0,0);
}
function userBanner(){ const u=me(); return `<div class="muted" style="margin-bottom:10px">${t('logged_as')}: <b>${esc(fullName(u))||'—'}</b> <a href="#" onclick="A.go('settings');return false">(${t('edit')})</a></div>`; }

function authShell(inner){ return `<div style="max-width:420px;margin:30px auto"><div style="text-align:center;margin-bottom:16px"><img src="${document.getElementById('logo').src}" style="width:120px;border-radius:24px"></div><div class="card">${inner}</div>
  <div class="hint" style="text-align:center">${t('online')} · <a href="${CONFIG.facebook}" target="_blank">Facebook</a></div></div>`; }
function viewAuth(){ const m=S.authMode||'login';
  if(m==='signup') return authShell(`<h2>${t('sign_up')}</h2><label class="f">${t('your_name')}</label><input type="text" id="au-name"><label class="f">${t('email')}</label><input type="email" id="au-email" autocomplete="email"><label class="f">${t('password')}</label><input type="password" id="au-pw" autocomplete="new-password">
    <button class="btn p block" onclick="A.signup()">${t('create_account')}</button><button class="btn ghost block" style="margin-top:8px" onclick="S.authMode='login';render()">${t('back_to_login')}</button>`);
  if(m==='forgot') return authShell(`<h2>${t('forgot')}</h2><label class="f">${t('email')}</label><input type="email" id="au-email" autocomplete="email"><button class="btn p block" onclick="A.forgot()">${t('send_reset')}</button><button class="btn ghost block" style="margin-top:8px" onclick="S.authMode='login';render()">${t('back_to_login')}</button>`);
  if(m==='reset') return authShell(`<h2>${t('new_password')}</h2><input type="password" id="au-pw" autocomplete="new-password"><button class="btn p block" onclick="A.resetPw()">${t('set_password')}</button>`);
  if(m==='created') return authShell(`<div class="empty">✅ ${t('account_created')}</div><button class="btn ghost block" onclick="S.authMode='login';render()">${t('back_to_login')}</button>`);
  return authShell(`<h2>${t('sign_in')}</h2><label class="f">${t('email')}</label><input type="email" id="au-email" autocomplete="email"><label class="f">${t('password')}</label><input type="password" id="au-pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')A.login()">
    <button class="btn y block" onclick="A.login()">${t('sign_in')}</button><div class="row" style="margin-top:10px"><button class="btn ghost grow" onclick="S.authMode='signup';render()">${t('sign_up')}</button><button class="btn ghost grow" onclick="S.authMode='forgot';render()">${t('forgot')}</button></div>`);
}
function viewWait(){ return authShell(`<div class="empty">⏳ ${t('waiting')}<br><br><span class="muted">${esc(SESSION?.user?.email||'')}</span></div><button class="btn ghost block" onclick="A.logout()">${t('sign_out')}</button>`); }
function viewUsers(){ if(!can('admin')) return `<div class="card muted">${t('no_permission')}</div>`;
  const pend=PROFILES.filter(p=>!p.approved), ok=PROFILES.filter(p=>p.approved); const roleOpts=Object.keys(CONFIG.roles).map(r=>({v:r,l:L(CONFIG.roles[r])}));
  const memOpts=[...DB.members].sort((a,b)=>fullName(a).localeCompare(fullName(b))).map(m=>({v:m.id,l:fullName(m)}));
  const linkedBy=id=>PROFILES.find(p=>p.member_id===id);
  const row=(p,pending)=>`<div class="card ${pending?'accent-red':''}"><b>${esc(p.display_name||'—')}</b> <span class="muted">${esc(p.email||'')}</span>
    <label class="f">${t('role')}</label><select id="ur-${p.user_id}" onchange="${pending?'':`A.setUserRole('${p.user_id}',this.value)`}">${sel(roleOpts,p.role)}</select>
    <label class="f">${t('link_member')}</label><select id="um-${p.user_id}">${sel(memOpts,p.member_id||'',t('new_member_from'))}</select>
    <div class="row">${pending?`<button class="btn g grow" onclick="A.approve('${p.user_id}')">✓ ${t('approve')}</button>`:`<button class="btn sm ghost" onclick="A.relink('${p.user_id}')">${t('save')}</button><button class="btn sm r right" onclick="A.revoke('${p.user_id}')">${t('revoke')}</button>`}</div></div>`;
  return `<h2>${t('users')}</h2><h3>${t('pending')} <span class="chip red">${pend.length}</span></h3>${pend.map(p=>row(p,true)).join('')||`<div class="empty">${t('none')}</div>`}
    <h3 style="margin-top:16px">${t('approved_users')} <span class="chip">${ok.length}</span></h3>${ok.map(p=>row(p,false)).join('')}`; }
function viewHome(){
  const ns=nextService(); const u=me(); let h='';
  if(ns){ const a=att(ns.date,ns.time); const on=u&&a.confirmed.includes(u.id);
    h+=`<div class="card accent-red"><div class="muted">${t('next_service')}</div><h2>${esc(ns.title)}</h2><div>${fmtDate(ns.date,true)} · ${fmt12(ns.time)}</div>
      <div class="row" style="margin-top:10px"><button class="btn ${on?'g':'y'}" onclick="A.confirmMe('${ns.date}','${ns.time}')">${on?'✓ '+t('confirmed'):t('confirm_me')}</button><span class="muted">${a.confirmed.length} ${t('confirmed_n')}</span></div></div>`; }
  if(u){ const soon=DB.shifts.filter(s=>s.memberIds.includes(u.id) && s.date>=todayYMD()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2);
    for(const s of soon) h+=`<div class="card accent-gold"><b>⭐ ${t('serving')}</b><div>${esc(s.ministry)} · ${fmtDate(s.date,true)} ${fmt12(s.time)}</div></div>`; }
  h+=`<h2>${t('bulletin')}</h2>
  <div class="card">${composeBox('')}
    <div class="row wrap"><label class="btn ghost sm">📷 ${t('photo')}<input type="file" accept="image/*" hidden onchange="A.pickPhoto(this,'newPostPhoto')"></label>
    ${can('pastorPost')?`<label class="chip"><input type="checkbox" id="asPastor"> ${t('pastor_msg')}</label><label class="chip"><input type="checkbox" id="pinPost"> ${t('pin')}</label>`:''}
    <button class="btn p right" onclick="A.addPost('')">${t('post')}</button></div><div id="newPostPhoto"></div></div>`;
  const posts=DB.posts.filter(p=>!p.groupId).sort((a,b)=>(b.pinned-a.pinned)||(b.createdAt-a.createdAt));
  if(!posts.length) h+=`<div class="empty">${t('none')}</div>`;
  for(const p of posts) h+=postCard(p);
  return h;
}
function composeBox(groupId){ const other=S.lang==='es'?'en':'es';
  return `<textarea id="newPost" placeholder="${groupId?t('write_group_post'):t('write_post')}"></textarea>
  <div id="post2wrap" style="display:none"><textarea id="newPost2" placeholder="${other==='en'?'English version...':'Versión en español...'}"></textarea><div class="hint">${t('second_lang_hint')}</div></div>
  <button class="btn ghost sm" style="margin-bottom:8px" onclick="const w=document.getElementById('post2wrap');w.style.display=w.style.display==='none'?'block':'none'">🌐 ${other==='en'?t('add_english'):t('add_spanish')}</button>`; }
function postCard(p){ const u=me(); const r=p.reactions||{amen:[],heart:[]}; const mine=k=>u&&r[k].includes(u.id);
  const own=u&&(u.id===p.authorId||can('edit'));
  return `<div class="card post ${p.isPastor?'pastor':''}"><div class="meta"><div class="avatar ${p.isPastor?'gold':''}">${esc(initials({first:p.authorName.split(' ')[0],last:p.authorName.split(' ')[1]||''}))}</div>
    <div class="grow"><b>${esc(p.authorName)}</b>${p.isPastor?` <span class="chip gold">✝ ${t('pastor_msg')}</span>`:''}${p.pinned?' 📌':''}<div class="muted">${ago(p.createdAt)}</div></div>
    ${own?`<button class="icon-btn" style="background:transparent;color:inherit" onclick="A.delPost('${p.id}')">🗑</button>`:''}</div>
    <div style="white-space:pre-wrap">${esc(postText(p))}</div>${p.photo?`<img class="photo" src="${p.photo}" onclick="A.viewPhoto('${p.id}')">`:''}
    <div class="row wrap" style="margin-top:10px"><button class="react ${mine('amen')?'on':''}" onclick="A.react('${p.id}','amen')">🙏 ${t('amen')} ${r.amen.length||''}</button>
    <button class="react ${mine('heart')?'on':''}" onclick="A.react('${p.id}','heart')">❤️ ${r.heart.length||''}</button>
    ${(p.text2&&p.lang!==S.lang)?'':`<a class="react" style="text-decoration:none;color:inherit" target="_blank" href="https://translate.google.com/?sl=auto&tl=${S.lang}&text=${encodeURIComponent(p.text)}&op=translate">🌐 ${t('translate')}</a>`}</div>
    <div style="margin-top:8px">${(p.comments||[]).map(c=>`<div class="comment"><b>${esc(c.name)}</b> <span class="muted">${ago(c.at)}</span><br>${esc(c.text)}</div>`).join('')}
    <div class="row" style="margin-top:6px"><input type="text" id="c-${p.id}" placeholder="${t('write_comment')}" style="margin:0"><button class="btn sm" onclick="A.comment('${p.id}')">${t('send')}</button></div></div></div>`; }

function viewCal(){
  if(!S.calMonth) S.calMonth=todayYMD().slice(0,7); if(!S.calSel) S.calSel=todayYMD();
  const [y,m]=S.calMonth.split('-').map(Number); const first=new Date(y,m-1,1); const start=(first.getDay()+6)%7; // Monday first
  const dim=new Date(y,m,0).getDate(); const cells=[]; for(let i=0;i<start;i++)cells.push(null); for(let d=1;d<=dim;d++)cells.push(toYMD(new Date(y,m-1,d)));
  let h=`<div class="row" style="margin-bottom:8px"><button class="btn sm" onclick="A.calMove(-1)">‹</button><h2 class="grow" style="text-align:center;margin:0">${t('months')[m-1]} ${y}</h2><button class="btn sm" onclick="A.calMove(1)">›</button></div>
  <div class="cal">${['day_mon','day_tue','day_wed','day_thu','day_fri','day_sat','day_sun'].map(k=>`<div class="dh">${t(k)}</div>`).join('')}
  ${cells.map(c=>c?`<div class="d ${c===todayYMD()?'today':''} ${c===S.calSel?'sel':''}" onclick="A.calPick('${c}')">${+c.slice(8)}<div class="dots">${[...new Set(eventsOn(c).map(e=>e.color))].slice(0,4).map(cl=>`<span class="dot ${cl}"></span>`).join('')}</div></div>`:'<div></div>').join('')}</div>
  <div class="row" style="margin:14px 0 8px"><h3 style="margin:0" class="grow">${t('events_on')} ${fmtDate(S.calSel,true)}</h3>${can('edit')?`<button class="btn sm p" onclick="A.eventForm()">＋ ${t('add_event')}</button>`:''}</div>`;
  const evs=eventsOn(S.calSel); if(!evs.length) h+=`<div class="empty">${t('none')}</div>`;
  const u=me();
  for(const e of evs){ const going=e.rsvp||[]; const on=u&&going.includes(u.id);
    h+=`<div class="card accent-${e.color}"><div class="row"><div class="grow"><b>${esc(e.title)}</b><div class="muted">${fmt12(e.time)}${e.place?' · '+esc(e.place):''}${e.weekly?' · '+t('weekly_event'):''}</div>${e.details?`<div style="margin-top:4px">${esc(e.details)}</div>`:''}</div>
      ${!e.weekly&&can('edit')?`<button class="btn sm ghost" onclick="A.eventForm('${e.id}')">✎</button>`:''}</div>
      <div class="row wrap" style="margin-top:8px">${!e.weekly?`<button class="btn sm ${on?'g':'y'}" onclick="A.rsvp('${e.id}')">${on?'✓ ':''}${t('rsvp')}</button><span class="muted">${going.length} ${t('going')}</span>`:''}
      <button class="btn sm ghost right" onclick="A.ics('${e.date}','${e.time}','${esc(e.title)}','${esc(e.place||'')}')">📲 ${t('add_to_phone')}</button></div></div>`; }
  return h;
}

function viewAtt(){
  const tab=S.tab.att||'mark'; const ns=nextService(); if(!S.attDate){ const last=lastServices(1)[0]||ns; S.attDate=last.date; S.attTime=last.time; }
  let h=`<h2>${t('nav_att')}</h2><div class="tabs">${[['mark',t('mark_attendance')],['reports',t('reports')],['shifts',t('shifts')]].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="A.tab('att','${k}')">${l}</button>`).join('')}</div>`;
  if(tab==='mark'){
    const ss=servicesOn(S.attDate);
    h+=`<div class="card"><label class="f">${t('date')}</label><input type="date" value="${S.attDate}" onchange="A.attDate(this.value)">
      <label class="f">${t('service')}</label><select onchange="S.attTime=this.value;render()">${sel(ss.map(s=>({v:s.time,l:fmt12(s.time)+' · '+s.title})),S.attTime)}</select>`;
    if(!ss.length){ h+=`<div class="muted">${t('no_service')}</div></div>`; return h; }
    if(!ss.find(s=>s.time===S.attTime)) S.attTime=ss[0].time;
    const a=att(S.attDate,S.attTime); const canMark=can('attendance');
    h+=`<div class="row"><span class="chip green">${t('present')}: ${a.present.length+a.visitors.length}</span><span class="chip">${t('confirmed')}: ${a.confirmed.length}</span>
      ${canMark?`<button class="btn sm ghost right" onclick="A.visitorForm()">＋ ${t('add_visitor')}</button>`:''}</div></div>
      <input type="search" placeholder="${t('search')}" value="${esc(S.search)}" oninput="S.search=this.value;A.rerenderList()">
      ${canMark?`<div class="hint">${t('mark_by_tap')}</div>`:''}<div class="card list" id="attList">${attList()}</div>`;
  } else if(tab==='reports'){
    const rt=S.tab.rep||'summary';
    h+=`<div class="tabs">${[['summary',t('summary')],['followup',t('followup')],['history',t('history')]].map(([k,l])=>`<button class="${rt===k?'on':''}" onclick="A.tab('rep','${k}')">${l}</button>`).join('')}</div>`;
    if(rt==='summary'){ const ls=lastServices(8).reverse(); const max=Math.max(1,...ls.map(s=>{const a=DB.attendance[attKey(s.date,s.time)];return a?a.present.length+a.visitors.length:0;}));
      h+=`<div class="card"><h3>${t('last_services')}</h3><div class="bar-row" style="margin:24px 4px 22px">${ls.map(s=>{const a=DB.attendance[attKey(s.date,s.time)];const n=a?a.present.length+a.visitors.length:0;return `<div style="height:${Math.round(n/max*100)}%"><span>${n}</span><small>${s.date.slice(5).replace('-','/')}<br>${fmt12(s.time)}</small></div>`;}).join('')}</div></div>`;
      h+=`<div class="card"><div class="muted">${t('members')}: <b>${DB.members.length}</b> · ${t('children')}: <b>${DB.children.length}</b> · ${t('households')}: <b>${DB.households.length}</b></div></div>`; }
    if(rt==='followup'){ const cutoff=lastServices(CONFIG.followUpWeeks*3); const seen=new Set(); cutoff.forEach(s=>(DB.attendance[attKey(s.date,s.time)]?.present||[]).forEach(id=>seen.add(id)));
      const missing=DB.members.filter(m=>!seen.has(m.id)); h+=`<div class="card"><h3>${t('not_seen')} ${CONFIG.followUpWeeks} ${t('weeks')}</h3><div class="list">${missing.length?missing.map(m=>`<div class="item"><div class="avatar blue">${initials(m)}</div><div class="grow"><b>${esc(fullName(m))}</b><div class="muted">${esc(m.phone||'')}</div></div>${m.phone?`<a class="btn sm" href="tel:${esc(m.phone)}">📞</a><a class="btn sm" href="sms:${esc(m.phone)}">💬</a>`:''}</div>`).join(''):`<div class="empty">🎉 ${t('none')}</div>`}</div></div>`; }
    if(rt==='history'){ const id=S.tab.histId||''; const m=DB.members.find(x=>x.id===id);
      h+=`<div class="card"><label class="f">${t('pick_person')}</label><select onchange="S.tab.histId=this.value;render()">${sel(DB.members.map(x=>({v:x.id,l:fullName(x)})),id,'—')}</select>`;
      if(m){ const keys=Object.keys(DB.attendance).filter(k=>DB.attendance[k].present.includes(id)).sort().reverse(); h+=`<div class="chip green">${keys.length} ${t('services_attended')}</div><div class="list">${keys.slice(0,30).map(k=>{const [d,tm]=k.split('|');return `<div class="item">✓ ${fmtDate(d,true)} · ${fmt12(tm)}</div>`;}).join('')}</div>`; }
      h+='</div>'; }
  } else {
    const up=DB.shifts.filter(s=>s.date>=todayYMD()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    h+=`<div class="row" style="margin-bottom:8px"><h3 class="grow" style="margin:0">${t('shifts')}</h3>${can('edit')?`<button class="btn sm p" onclick="A.shiftForm()">＋ ${t('add_shift')}</button>`:''}</div>`;
    if(!up.length) h+=`<div class="empty">${t('none')}</div>`;
    for(const s of up) h+=`<div class="card accent-gold"><div class="row"><div class="grow"><b>${esc(s.ministry)}</b><div class="muted">${fmtDate(s.date,true)} · ${fmt12(s.time)}</div><div>${s.memberIds.map(id=>esc(fullName(DB.members.find(m=>m.id===id)))).filter(Boolean).join(', ')}</div></div>${can('edit')?`<button class="btn sm ghost" onclick="A.shiftForm('${s.id}')">✎</button>`:''}</div></div>`;
  }
  return h;
}
function attList(){ const a=att(S.attDate,S.attTime); const q=S.search.toLowerCase(); const canMark=can('attendance');
  const ms=DB.members.filter(m=>fullName(m).toLowerCase().includes(q)).sort((x,y)=>fullName(x).localeCompare(fullName(y)));
  return ms.map(m=>{const on=a.present.includes(m.id);const c=a.confirmed.includes(m.id);
    return `<div class="item" ${canMark?`onclick="A.markPresent('${m.id}')"`:''}><div class="toggle ${on?'on':''}">${on?'✓':''}</div><div class="grow"><b>${esc(fullName(m))}</b><div class="muted">${esc(m.ministry||'')}${c?' · ✓ '+t('confirmed'):''}</div></div></div>`;}).join('')
  + a.visitors.map((v,i)=>`<div class="item"><div class="toggle on">✓</div><div class="grow"><b>${esc(v.name)}</b> <span class="chip">${t('visitor')}</span><div class="muted">${esc(v.phone||'')}</div></div>${canMark?`<button class="btn sm ghost" onclick="A.delVisitor(${i})">✕</button>`:''}</div>`).join('');
}

function viewKids(){
  if(!can('kids')){ return `<h2>${t('kids_checkin')}</h2>${userBanner()}<div class="card"><div class="muted">${t('no_permission')}</div></div>`+myKidsCard(); }
  const ns=nextService(); const last=lastServices(1)[0]; const cur=S.kidsSvc||(ns&&ns.date===todayYMD()?ns:(last||ns)); S.kidsSvc=cur;
  const ss=servicesOn(cur.date); const key=attKey(cur.date,cur.time);
  let h=`<h2>${t('kids_checkin')}</h2><div class="card"><div class="row"><div class="grow"><label class="f">${t('date')}</label><input type="date" value="${cur.date}" onchange="A.kidsDate(this.value)"></div>
    <div class="grow"><label class="f">${t('service')}</label><select onchange="S.kidsSvc={...S.kidsSvc,time:this.value};render()">${sel(ss.map(s=>({v:s.time,l:fmt12(s.time)})),cur.time)}</select></div></div></div>`;
  if(!ss.length) return h+`<div class="empty">${t('no_service')}</div>`;
  h+=`<div class="tabs">${CONFIG.ageGroups.map(g=>`<button class="${S.kidsGroup===g.id?'on':''}" onclick="S.kidsGroup='${g.id}';render()">${L(g)}</button>`).join('')}</div>`;
  const kids=DB.children.filter(c=>groupOf(c)===S.kidsGroup).sort((a,b)=>a.name.localeCompare(b.name));
  const recs=DB.kids.filter(r=>r.serviceKey===key); const inNow=kids.filter(c=>{const r=recs.find(x=>x.childId===c.id);return r&&!r.checkOutAt;}).length;
  h+=`<div class="row" style="margin-bottom:8px"><span class="chip green">${inNow} ${t('in_class')}</span><button class="btn sm ghost right" onclick="A.childForm('','')">＋ ${t('add_kid_here')}</button></div><div class="card list">`;
  if(!kids.length) h+=`<div class="empty">${t('no_kids')}</div>`;
  for(const c of kids){ const r=recs.find(x=>x.childId===c.id); const st=!r?'none':(r.checkOutAt?'out':'in'); const hh=DB.households.find(x=>x.id===c.householdId);

/* === ACTIONS (A.) ===  Everything a button calls. Keep each one small. */
const A = {
  go(v){ S.view=v; S.search=''; render(); },
  tab(g,v){ S.tab[g]=v; render(); },
  toggleLang(){ S.lang=S.lang==='es'?'en':'es'; saveS(); render(); },
  toggleTheme(){ S.theme=S.theme==='dark'?'light':'dark'; saveS(); render(); },
  modal(html){ document.getElementById('modal').innerHTML='<div class="bar"></div>'+html; document.getElementById('overlay').classList.add('show'); },
  closeModal(){ document.getElementById('overlay').classList.remove('show'); },
  // --- bulletin
  pickPhoto(input,targetId){ const f=input.files[0]; if(!f) return; shrinkImage(f,url=>{ const el=document.getElementById(targetId); el.dataset.photo=url; el.innerHTML=`<img src="${url}" style="width:100%;border-radius:12px;margin-top:8px">`; }); },
  addPost(groupId){ const u=me(); const text=document.getElementById('newPost').value.trim(); const text2=(document.getElementById('newPost2')?.value||'').trim(); const photo=document.getElementById('newPostPhoto')?.dataset.photo||null; if(!text&&!photo) return;
    const isPastor=!groupId&&!!document.getElementById('asPastor')?.checked && can('pastorPost'); const pinned=!groupId&&!!document.getElementById('pinPost')?.checked && can('pastorPost');
    DB.posts.unshift({id:uid(),authorId:u?u.id:null,authorName:u?fullName(u):'—',isPastor,pinned,text,text2:text2||null,lang:S.lang,groupId:groupId||null,photo,createdAt:Date.now(),reactions:{amen:[],heart:[]},comments:[]}); saveDB(); render(); toast(t('saved')); },
  delPost(id){ if(!sure('del'))return; DB.posts=DB.posts.filter(p=>p.id!==id); saveDB(); render(); },
  react(id,k){ const u=me(); if(!u)return; const p=DB.posts.find(x=>x.id===id); const arr=p.reactions[k]; const i=arr.indexOf(u.id); i>=0?arr.splice(i,1):arr.push(u.id); saveDB(); render(); },
  comment(id){ const u=me(); const el=document.getElementById('c-'+id); const text=el.value.trim(); if(!text)return; DB.posts.find(x=>x.id===id).comments.push({name:u?fullName(u):'—',text,at:Date.now()}); saveDB(); render(); },
  translate(id){ const p=DB.posts.find(x=>x.id===id); const tl=S.lang==='es'?'es':'en'; window.open(`https://translate.google.com/?sl=auto&tl=${tl}&text=${encodeURIComponent(p.text)}&op=translate`,'_blank'); },
  viewPhoto(id){ const p=DB.posts.find(x=>x.id===id); A.modal(`<img src="${p.photo}" style="width:100%;border-radius:12px">`); },
  confirmMe(d,tm){ const u=me(); if(!u)return; const a=att(d,tm); const i=a.confirmed.indexOf(u.id); i>=0?a.confirmed.splice(i,1):a.confirmed.push(u.id); saveDB(); render(); },
  // --- calendar
  calMove(n){ const [y,m]=S.calMonth.split('-').map(Number); const d=new Date(y,m-1+n,1); S.calMonth=toYMD(d).slice(0,7); render(); },
  calPick(d){ S.calSel=d; render(); },
  rsvp(id){ const u=me(); if(!u)return; const e=DB.events.find(x=>x.id===id); e.rsvp=e.rsvp||[]; const i=e.rsvp.indexOf(u.id); i>=0?e.rsvp.splice(i,1):e.rsvp.push(u.id); saveDB(); render(); },
  ics(date,time,title,place){ const [h,m]=time.split(':'); const s=date.replace(/-/g,'')+'T'+h+m+'00'; const e2=date.replace(/-/g,'')+'T'+String(+h+2).padStart(2,'0')+m+'00';
    download(title+'.ics',`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//NuevoPacto//ES\nBEGIN:VEVENT\nUID:${uid()}@nuevopacto\nDTSTART:${s}\nDTEND:${e2}\nSUMMARY:${title}\nLOCATION:${place}\nEND:VEVENT\nEND:VCALENDAR`,'text/calendar'); },
  eventForm(id){ const e=DB.events.find(x=>x.id===id)||{title:'',date:S.calSel,time:'19:00',place:'',details:'',ministry:'',color:'o'};
    A.modal(`<h3>${id?t('edit'):t('add_event')}</h3><label class="f">${t('title')}</label><input type="text" id="e-title" value="${esc(e.title)}">
    <div class="row"><div class="grow"><label class="f">${t('date')}</label><input type="date" id="e-date" value="${e.date}"></div><div class="grow"><label class="f">${t('time')}</label><input type="time" id="e-time" value="${e.time}"></div></div>
    <label class="f">${t('place')}</label><input type="text" id="e-place" value="${esc(e.place)}"><label class="f">${t('ministry')}</label><input type="text" id="e-min" value="${esc(e.ministry)}" placeholder="${t('ministries_hint')}">
    <label class="f">${t('details')}</label><textarea id="e-det">${esc(e.details)}</textarea>
    <div class="row"><button class="btn p grow" onclick="A.saveEvent('${id||''}')">${t('save')}</button>${id?`<button class="btn r" onclick="A.delEvent('${id}')">🗑</button>`:''}<button class="btn" onclick="A.closeModal()">${t('cancel')}</button></div>`); },

  doImport(){ const raw=document.getElementById('imp').value.trim(); if(!raw)return; const sep=raw.includes('\t')?'\t':','; const rows=raw.split(/\r?\n/).map(r=>r.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));

  saveGroup(id){ const g=DB.groups.find(x=>x.id===id)||{id:uid()}; g.name=document.getElementById('g-name').value.trim(); g.color=document.getElementById('g-color').value; g.memberIds=[...document.querySelectorAll('.g-m:checked')].map(c=>c.value); if(!g.name)return; if(!id) DB.groups.push(g); saveDB(); A.closeModal(); render(); toast(t('saved')); },
  delGroup(id){ if(!sure('del'))return; DB.groups=DB.groups.filter(x=>x.id!==id); DB.posts=DB.posts.filter(p=>p.groupId!==id); saveDB(); A.closeModal(); A.go('groups'); },
  // --- administrator messages
  sendAdminMsg(){ const text=document.getElementById('amText').value.trim(); if(!text)return; const u=me(); DB.adminMsgs.unshift({id:uid(),fromId:u?u.id:null,fromName:u?fullName(u):'—',text,at:Date.now(),read:false}); saveDB(); render(); toast(t('sent')); },
  readAdminMsg(id){ DB.adminMsgs.find(m=>m.id===id).read=true; saveDB(); render(); },
  delAdminMsg(id){ if(!sure('del'))return; DB.adminMsgs=DB.adminMsgs.filter(m=>m.id!==id); saveDB(); render(); },
  // --- auth (online only)
  async login(){ const email=document.getElementById('au-email').value.trim(), pw=document.getElementById('au-pw').value; if(!email||!pw) return; const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) toast(t('login_failed')); },
  async signup(){ const name=document.getElementById('au-name').value.trim(), email=document.getElementById('au-email').value.trim(), pw=document.getElementById('au-pw').value; if(!name||!email) return; if(pw.length<8){ toast(t('pw_short')); return; }
    const {error}=await sb.auth.signUp({email,password:pw,options:{data:{name}}}); if(error){ toast(error.message); return; } S.authMode='created'; render(); },
  async forgot(){ const email=document.getElementById('au-email').value.trim(); if(!email) return; const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error){ toast(error.message); return; } toast(t('reset_sent')); S.authMode='login'; render(); },
  async resetPw(){ const pw=document.getElementById('au-pw').value; if(pw.length<8){ toast(t('pw_short')); return; } const {error}=await sb.auth.updateUser({password:pw}); if(error){ toast(error.message); return; } S.authMode='login'; toast(t('pw_changed')); await afterLogin(); },
  async changePw(){ const pw=document.getElementById('np').value; if(pw.length<8){ toast(t('pw_short')); return; } const {error}=await sb.auth.updateUser({password:pw}); toast(error?error.message:t('pw_changed')); },
  async logout(){ await sb.auth.signOut(); S.authMode='login'; },
  // --- users & access (administrator)
  async approve(uidv){ const p=PROFILES.find(x=>x.user_id===uidv); const role=document.getElementById('ur-'+uidv).value; let mid=document.getElementById('um-'+uidv).value;
    if(!mid){ const [first,...rest]=(p.display_name||p.email).split(' '); const m={id:uid(),first,last:rest.join(' '),phone:'',email:p.email||'',birthdate:'',ministry:'',role,householdId:null,notes:''}; DB.members.push(m); mid=m.id; }
    else { const m=DB.members.find(x=>x.id===mid); if(m){ m.role=role; if(!m.email) m.email=p.email||''; } }
    saveDB(); const {error}=await sb.from('profiles').update({approved:true,role,member_id:mid}).eq('user_id',uidv); if(error){ toast(t('sync_error')); return; } await loadProfiles(); render(); toast(t('saved')); },
  async relink(uidv){ const role=document.getElementById('ur-'+uidv).value, mid=document.getElementById('um-'+uidv).value||null; const m=DB.members.find(x=>x.id===mid); if(m){ m.role=role; saveDB(); }
    const {error}=await sb.from('profiles').update({role,member_id:mid}).eq('user_id',uidv); if(error){ toast(t('sync_error')); return; } await loadProfiles(); render(); toast(t('saved')); },
  async setUserRole(uidv,role){ const p=PROFILES.find(x=>x.user_id===uidv); const m=DB.members.find(x=>x.id===p.member_id); if(m){ m.role=role; saveDB(); } await sb.from('profiles').update({role}).eq('user_id',uidv); await loadProfiles(); render(); },
  async revoke(uidv){ if(!sure('revoke')) return; await sb.from('profiles').update({approved:false}).eq('user_id',uidv); await loadProfiles(); render(); },
  // --- settings / backup
  backup(){ download(`nuevopacto-respaldo-${todayYMD()}.json`, JSON.stringify({version:1,exportedAt:new Date().toISOString(),db:DB},null,1)); toast(t('saved')); },
  restore(input){ const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=e=>{ try{ const j=JSON.parse(e.target.result); DB=Object.assign(emptyDB(), j.db||j); saveDB(); render(); toast(t('saved')); }catch(err){ toast('Error'); } }; r.readAsText(f); },
  demo(){ loadDemo(); render(); toast(t('saved')); },
  wipe(){ if(!sure('wipe'))return; DB=emptyDB(); S.userId=null; saveDB(); saveS(); render(); },
};
function normDate(s){ if(!s)return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s; const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/); if(m){ let y=m[3]; if(y.length===2) y=(+y>30?'19':'20')+y; return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; } return ''; }
